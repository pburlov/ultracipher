# Veroeffentlicht Web-App (Firebase Hosting) und Sync-Server-Funktion (Cloud
# Functions, siehe server/firebase/) in EIN Firebase-Projekt, damit beide denselben
# Origin haben. Laeuft nur, wenn im Repo (Fork) Variablen gesetzt sind
# (Settings -> Secrets and variables -> Actions -> Variables):
#   DEPLOY_FIREBASE                = true   Schalter; ohne ihn passiert nichts
#   FIREBASE_PROJECT_ID                     ID des Firebase-Projekts
#   GCP_WORKLOAD_IDENTITY_PROVIDER          Workload Identity Federation: voller Name des
#                                           Providers (projects/<nr>/locations/global/
#                                           workloadIdentityPools/<pool>/providers/<provider>)
#   GCP_SERVICE_ACCOUNT                     Service-Account, den der Workflow annimmt
# Es gibt keine Secrets und keinen langlebigen Schluessel. Einrichtung in
# docs/self-hosting.md. Vor dem Deploy laufen dieselben Pruefungen wie in pages.yml.
name: Firebase deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    # Nie fuer Pull Requests (Forks); nur mit gesetzter Repo-Variable.
    if: vars.DEPLOY_FIREBASE == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # id-token: fuer den OIDC-Token der Workload Identity Federation.
    permissions:
      contents: read
      id-token: write
    # Ein Deploy gleichzeitig; ein laufender wird nicht abgebrochen.
    concurrency:
      group: firebase
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Flutter-Version fest, wie in pages.yml (reproduzierbarer Web-Build).
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.8
          cache: true

      - run: flutter pub get
        working-directory: ultracipher_flutter

      # Die zwei bekannten Infos duerfen den Deploy nicht verhindern.
      - run: flutter analyze --no-fatal-infos
        working-directory: ultracipher_flutter

      - run: flutter test --concurrency=4
        working-directory: ultracipher_flutter

      # Node 22 wie in server/firebase/functions/package.json (engines).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # Installiert die Abhaengigkeiten genau nach package-lock.json; die Firebase-CLI
      # braucht sie, um die Funktion beim Deploy zu laden.
      - run: npm ci
        working-directory: server/firebase/functions

      - run: npm test
        working-directory: server/firebase/functions

      # Eigene Domain: base-href "/". Pfad relativ zum Repo-Root (firebase.json).
      - run: flutter build web --wasm --no-web-resources-cdn --base-href "/"
        working-directory: ultracipher_flutter

      # Anmeldung bei Google Cloud ohne gespeicherten Schluessel; legt die
      # Anmeldedaten fuer die folgenden Schritte (GOOGLE_APPLICATION_CREDENTIALS) an.
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      # Firebase-CLI-Version fest. Keine .firebaserc im Repo, die Projekt-ID kommt
      # aus der Variable. Werte ueber env statt direkt in die Shell einsetzen.
      - run: npx --yes firebase-tools@15.35.0 deploy --only hosting,functions --project "$FIREBASE_PROJECT_ID" --non-interactive
        env:
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
